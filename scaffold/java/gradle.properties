GROUP=@@JAVA_PACKAGE@@
POM_ARTIFACT_ID=@@NPM_PACKAGE@@
# x-release-please-start-version
VERSION_NAME=@@VERSION@@
# x-release-please-end
POM_NAME=@@CLIENT_NAME@@
POM_DESCRIPTION=@@DESCRIPTION@@
# Maven Central requires every POM_ property: https://vanniktech.github.io/gradle-maven-publish-plugin/central/
POM_URL=@@PROJECT_URL@@
POM_LICENSE_NAME=@@LICENSE@@
POM_LICENSE_URL=@@LICENSE_URL@@
POM_SCM_URL=@@REPOSITORY@@
POM_SCM_CONNECTION=scm:git:@@REPOSITORY@@.git
POM_SCM_DEV_CONNECTION=scm:git:@@REPOSITORY@@.git
POM_DEVELOPER_ID=@@AUTHOR_ID@@
POM_DEVELOPER_NAME=@@AUTHOR_NAME@@
# Large APIs compile beyond Gradle's default 512 MiB heap
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
