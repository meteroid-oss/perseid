[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "@@PACKAGE_NAME@@"
version = "@@VERSION@@"
description = "@@CLIENT_NAME@@ API client"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27,<1"]

[tool.hatch.build.targets.wheel]
packages = ["@@PACKAGE_NAME@@"]
