# Written by `perseid init` or `perseid sync`, which rewrite it: delete this line to keep your edits.
name: SDK CI

on:
  push:
    branches: ["@@BRANCH@@"]
    paths: ["@@PATHS@@"]
  pull_request:
    paths: ["@@PATHS@@"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        path: ["@@SDKS@@"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2
      # Pull requests and pushes test the SDKs they change, all of them when they change this
      # workflow. The other jobs pass without testing, so that all can be required checks.
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SDK_PATH: ${{ matrix.path }}
        run: |
          case "$EVENT" in
            pull_request) base=HEAD^1 ;;
            push) base=$(git rev-parse --quiet --verify "$BEFORE^{commit}") || base= ;;
            *) base= ;;
          esac
          if [ -z "$base" ] || ! git diff --quiet "$base" HEAD -- "$SDK_PATH" .github/workflows/sdk-ci.yml; then
            echo "test=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.test == 'true'
        uses: meteroid-oss/perseid/test@v0
        with:
          path: ${{ matrix.path }}

  # Dispatched runs don't show in a pull request's checks: require this status to gate merges on them.
  status:
    needs: test
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ needs.test.result == 'success' && 'success' || 'failure' }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f context=sdk-ci -f state="$STATE" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
