[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app; Homebrew and npm need the setup of README.md
installers = ["shell", "powershell", "homebrew", "npm"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# release-please makes the GitHub Release as a draft with its tag, then dispatches the release workflow
create-release = false
dispatch-releases = true
# `brew install <owner>/tap/@@NPM_PACKAGE@@` and `npm install -g @@NPM_PACKAGE@@`
formula = "@@NPM_PACKAGE@@"
npm-package = "@@NPM_PACKAGE@@"
# dist's Homebrew and npm jobs, each skipped without a credential (README.md, Releasing)
publish-jobs = ["./publish-homebrew", "./publish-npm"]
# The MCP bundles (.mcpb), one per platform, on the release once it is out
post-announce-jobs = ["./publish-mcpb"]
