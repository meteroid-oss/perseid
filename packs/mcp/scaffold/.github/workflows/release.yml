# Publishes the server when package.json carries a version npm does not have yet: perseid sets it
# to the SDK's, so merging a regeneration pull request releases it. npm trusted publishing, else
# the NPM_TOKEN secret, which only the first publish needs; then the image on ghcr.io.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - id: version
        run: echo "version=$(npm pkg get version | tr -d '"')" >> "$GITHUB_OUTPUT"
      - id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name=$(npm pkg get name | tr -d '"')
          if npm view "$name@$VERSION" version > /dev/null 2>&1; then
            echo "::notice::$name@$VERSION is already on npm"
            exit 0
          fi
          npm install -g 'npm@^11.5.1'
          npm install --no-audit --no-fund
          npm run build
          if [ -z "$NODE_AUTH_TOKEN" ] && ! npm view "$name" name > /dev/null 2>&1; then
            echo "::notice::$name is not on npm yet: its first publish needs the NPM_TOKEN secret, then trusted publishing"
          else
            npm pkg set repository.type=git "repository.url=git+$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
            npm publish --access public --provenance
          fi
          git tag "v$VERSION" && git push origin "v$VERSION"
          echo "published=true" >> "$GITHUB_OUTPUT"

  image:
    needs: npm
    if: needs.npm.outputs.published == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.npm.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

  # The MCP bundle, for Claude Desktop and the clients installing bundles: on the GitHub release
  # of the version, with QuickJS for a sandbox (no Deno to ship).
  mcpb:
    needs: npm
    if: needs.npm.outputs.published == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund && npm run mcpb
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.npm.outputs.version }}
        run: |
          gh release view "v$VERSION" > /dev/null 2>&1 || gh release create "v$VERSION" --title "v$VERSION" --generate-notes
          gh release upload "v$VERSION" ./*.mcpb --clobber
