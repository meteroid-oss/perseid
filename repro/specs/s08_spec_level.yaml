openapi: 3.0.3
info: {title: Spec Level, version: 1.0.0}
servers:
  - url: '{scheme}://{region}.api.example.com/{basePath}'
    variables:
      scheme: {default: https, enum: [https, http]}
      region: {default: eu}
      basePath: {default: v1}
paths:
  /things/{thingId}:
    parameters:
      - $ref: '#/components/parameters/ThingId'
    post:
      operationId: post_thing
      tags: [things]
      parameters:
        - $ref: '#/components/parameters/Q'
      requestBody:
        $ref: '#/components/requestBodies/ThingBody'
      responses:
        '200':
          $ref: '#/components/responses/ThingResp'
        '400':
          $ref: '#/components/responses/Err'
  /circ:
    get:
      operationId: circ
      tags: [things]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Child'}
  /pointer:
    get:
      operationId: pointer
      tags: [things]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PtrHolder'}
components:
  parameters:
    ThingId: {name: thingId, in: path, required: true, schema: {type: string}}
    Q: {name: q, in: query, schema: {type: string, nullable: true}}
  requestBodies:
    ThingBody:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Thing'}
  responses:
    ThingResp:
      description: ok
      headers:
        X-Id: {$ref: '#/components/headers/XId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Thing'}
    Err:
      description: err
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
  headers:
    XId: {schema: {type: string}}
  schemas:
    Thing:
      type: object
      required: [name, maybe]
      properties:
        name: {type: string}
        maybe: {type: string, nullable: true}
        maybe_ref:
          nullable: true
          allOf: [{$ref: '#/components/schemas/Problem'}]
        maybe_int: {type: integer, nullable: true}
        maybe_arr: {type: array, nullable: true, items: {type: string, nullable: true}}
        excl: {type: number, exclusiveMinimum: true, minimum: 0}
    Problem:
      type: object
      properties:
        detail: {type: string}
    Parent:
      type: object
      properties:
        children:
          type: array
          items: {$ref: '#/components/schemas/Child'}
    Child:
      allOf:
        - {$ref: '#/components/schemas/Parent'}
        - type: object
          properties:
            parent: {$ref: '#/components/schemas/Parent'}
    a/b:
      type: object
      properties:
        v: {type: string}
    PtrHolder:
      type: object
      properties:
        escaped: {$ref: '#/components/schemas/a~1b'}
        prop_ref: {$ref: '#/components/schemas/Thing/properties/name'}
