openapi: 3.1.0
info:
  title: Desc Fuzz
  version: 1.0.0
  description: "Ends comment */ then \"\"\" triple and ''' and \\ backslash {{ jinja }} {% raw %} ${x} `tick` </script> \r\n crlf \u0000"
servers: [{url: https://x.example.com}]
tags:
  - name: things
    description: "tag */ \"\"\" \\"
paths:
  /things/{id}:
    get:
      operationId: get_thing
      summary: "Summary */ \"\"\" \\ {{x}}"
      description: |
        Multi-line */ description
        with """ triple quotes """ and \ backslash at end \
        and a line with only a slash: /
        // comment-ish
        #[attr] and /// doc and @param x and @return y and <b>html</b> & entity &amp;
        ```rust
        fn main() {}
        ```
      tags: [things]
      deprecated: true
      parameters:
        - name: id
          in: path
          required: true
          description: "param */ \"\"\" \\"
          schema: {type: string}
        - name: q
          in: query
          description: "ends with backslash \\"
          schema: {type: string, default: "quote\" */ \\ {{x}}"}
      responses:
        '200':
          description: "resp */"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Thing'}
components:
  schemas:
    Thing:
      title: "Title */ \"\"\""
      description: "Schema */ \"\"\" \\"
      type: object
      properties:
        a:
          type: string
          description: "prop */ \"\"\" ''' \\"
          default: "def \" ' \\ */ ${x} {{y}} \n newline"
          example: "*/"
        b:
          type: string
          description: "ends with backslash \\"
        c:
          type: string
          description: "ends with quote \""
        e:
          $ref: '#/components/schemas/E'
        n:
          type: number
          default: 1e400
        big:
          type: integer
          default: 99999999999999999999
        arr:
          type: array
          items: {type: string}
          default: [a, "b\"c"]
        obj:
          type: object
          default: {k: v}
        nul:
          type: [string, 'null']
          default: null
        mismatched:
          type: integer
          default: "not an int"
    E:
      type: string
      description: "enum */ \"\"\""
      enum: ["*/", "\"\"\"", "\\", "${x}", "{{y}}", "a\"b", "new\nline"]
      x-enum-descriptions: ["*/ one", "\"\"\" two", "\\", "x", "y", "z", "w"]
