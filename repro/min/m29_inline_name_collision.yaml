openapi: 3.1.0
info: {title: Inline Collide Min, version: 1.0.0}
servers: [{url: https://x.example.com}]
paths:
  /pets:
    post:
      operationId: create_pet
      tags: [pets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                n: {type: integer}
      responses:
        '200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Pet'}}}}
components:
  schemas:
    CreatePetRequest: {type: object, required: [zzz], properties: {zzz: {type: boolean}}}
    PetsCreateRequest: {type: object, required: [zzz], properties: {zzz: {type: boolean}}}
    PetOwner: {type: object, required: [x], properties: {x: {type: boolean}}}
    Pet:
      type: object
      properties:
        owner:
          type: object
          properties:
            name: {type: string}
        other: {$ref: '#/components/schemas/PetOwner'}
        a: {$ref: '#/components/schemas/CreatePetRequest'}
        b: {$ref: '#/components/schemas/PetsCreateRequest'}
