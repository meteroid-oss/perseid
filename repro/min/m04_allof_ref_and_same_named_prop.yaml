openapi: 3.1.0
info: {title: Allof Prop Min, version: 1.0.0}
servers: [{url: https://x.example.com}]
paths:
  /echo:
    post:
      operationId: echo
      tags: [echo]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Child'}}}
      responses:
        '200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Child'}}}}
components:
  schemas:
    Owner: {type: object, properties: {id: {type: string}}}
    Child:
      allOf:
        - $ref: '#/components/schemas/Owner'
        - type: object
          properties:
            owner: {type: string}
