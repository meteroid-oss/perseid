[package]
name = "perseid"
version = "0.7.0"
rust-version = "1.88"
edition = "2024"
license = "Apache-2.0 AND MIT"
description = "OpenAPI in, idiomatic SDKs out: Rust, TypeScript, Python, Go, Java and C# from one static binary"
readme = "README.md"
keywords = ["openapi", "sdk", "codegen", "api", "generator"]
categories = ["development-tools", "command-line-utilities"]
repository = "https://github.com/meteroid-oss/perseid"

[dependencies]
aide = "0.14.1"
anyhow = "1.0.94"
base64 = "0.22"
camino = "1.1.9"
clap = { version = "4.5.23", features = ["derive", "env"] }
cliclack = "0.5.6"
crypto_box = { version = "0.9", features = ["seal"] }
deunicode = "1.6.2"
fs-err = "3.0.0"
heck = "0.5.0"
indexmap = "2.7.0"
itertools = "0.14.0"
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
minijinja = { version = "2.8.0", features = ["loader", "json"] }
schemars = { version = "0.8.21", features = ["derive"] }
serde = { version = "1.0.215", features = ["derive", "rc"] }
serde_json = { version = "1.0.133", features = ["preserve_order"] }
serde_norway = "0.9"
sha2 = "0.10"
ssh-key = { version = "0.6", features = ["ed25519", "rand_core", "std"] }
tempfile = "3.14.0"
toml = "0.8.23"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
ureq = { version = "3.2.0", default-features = false, features = ["rustls", "platform-verifier"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
