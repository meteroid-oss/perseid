# Copy to the PRIVATE BACKEND as .github/workflows/notify-openapi.yml.
# The spec is committed in Git. No Perseid or SDK toolchain runs in this repo.
name: Notify SDK orchestrator
on:
  push:
    branches: [main]
    paths:
      - apis/generated/openapi.json
  workflow_dispatch:
permissions: {}
jobs:
  notify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/create-github-app-token@v3
        id: dispatch-token
        with:
          client-id: ${{ vars.PERSEID_APP_CLIENT_ID }}
          private-key: ${{ secrets.PERSEID_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.ORCHESTRATOR_REPOSITORY_NAME }}
          permission-contents: write
      - name: Notify the orchestration repository
        env:
          GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          ORCHESTRATOR_REPOSITORY: ${{ vars.ORCHESTRATOR_REPOSITORY_NAME }}
        run: |
          gh api --method POST "repos/$REPOSITORY_OWNER/$ORCHESTRATOR_REPOSITORY/dispatches" \
            -f event_type=openapi-updated
