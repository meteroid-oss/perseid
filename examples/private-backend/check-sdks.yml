# Copy to the ORCHESTRATION/CLIENTS REPOSITORY as .github/workflows/check-sdks.yml.
# Uses the committed spec snapshot; no private backend checkout or App key needed.
name: Check SDKs
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: perseid-sdk-tools
      - name: Install pinned generator and formatters
        run: bash .perseid/setup-ci.sh
      - name: Check committed generation and SDK builds
        run: perseid check
