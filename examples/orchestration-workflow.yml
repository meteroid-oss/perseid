# Consumer example: adapt toolchains, pin the Perseid commit, then move to
# .github/workflows/update-sdks.yml in the configuration/clients repository.
name: Update SDKs
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: perseid-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: meteroid-oss/perseid
          # Replace with an immutable commit after the orchestration PR merges.
          ref: main
          path: perseid
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Install the selected formatters on PATH (see docs/orchestration.md).
      # The standalone Docker image bundles all five formatters.
      # Install Node/Java/Go/etc. as required by configured SDK checks.
      - name: Build native Perseid
        run: cargo build --locked --release --manifest-path perseid/Cargo.toml
      - name: Synchronize and open SDK pull requests
        working-directory: project
        env:
          # Set PERSEID_TOKEN to an App token/PAT for cross-repository updates.
          GH_TOKEN: ${{ secrets.PERSEID_TOKEN || github.token }}
        run: |
          gh auth setup-git
          ../perseid/target/release/perseid sync
          ../perseid/target/release/perseid generate --pr
