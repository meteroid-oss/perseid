name = "example"
perseid_version = "0.1.0"

[source]
file = "../backend/openapi.json"

[sdk]
default_base_url = "https://api.example.com"

[targets.rust]
check_commands = ["cargo test --locked"]

[targets.typescript]
check_commands = ["npm ci --ignore-scripts", "npm test"]

# An external target needs only repository and directory:
# [targets.go]
# repository = "acme/example-go"
# directory = "."
# check_commands = ["go test ./..."]

# Independent SDK versions and standard formatters are the defaults.
# Destination repositories can own .perseid/overrides.toml.
