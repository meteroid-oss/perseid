post:
  operationId: createPet
  parameters:
    - name: pet
      in: body
      required: true
      schema:
        $ref: '../defs.yaml#/Pet'
    - $ref: '../swagger.yaml#/parameters/Limit'
  responses:
    '200':
      description: The pet.
      schema:
        $ref: '../defs.yaml#/Pet'
    '404':
      $ref: '../swagger.yaml#/responses/NotFound'
