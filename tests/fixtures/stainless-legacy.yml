# yaml-language-server: $schema=https://app.stainlessapi.com/config.schema.json
# Modeled on OneBusAway/sdk-config stainless/openapi.stainless.yml: the `node` target of older
# configs, a query parameter API key, and no spec next to it.

organization:
  name: onebusaway-sdk
  docs: https://developer.onebusaway.org
  contact: info@onebusaway.org

targets:
  node:
    package_name: onebusaway-sdk
    production_repo: OneBusAway/js-sdk
    publish:
      npm: true
    staging_repo: OneBusAway/onebusaway-node-staging
  python:
    package_name: onebusaway
    production_repo: OneBusAway/python-sdk
    publish:
      pypi: true
  go:
    package_name: onebusaway
    production_repo: OneBusAway/go-sdk
    options:
      go_module_path_override: github.com/OneBusAway/go-sdk/v2
  java:
    reverse_domain: org.onebusaway
    production_repo: OneBusAway/java-sdk
    publish:
      maven:
        sonatype_platform: portal
  kotlin:
    reverse_domain: org.onebusaway
    production_repo: OneBusAway/kotlin-sdk
  ruby:
    gem_name: onebusaway-sdk
    production_repo: OneBusAway/ruby-sdk

settings:
  license: Apache-2.0

client_settings:
  default_timeout: 120000
  default_retries:
    max_retries: 4
    initial_delay_seconds: 0.5
    max_delay_seconds: 8
  opts:
    api_key:
      type: string
      auth:
        security_scheme: ApiKeyAuth
      read_env: ONEBUSAWAY_API_KEY
      send_as_query_param: key

security_schemes:
  ApiKeyAuth:
    type: apiKey
    in: query
    name: key

environments:
  production: https://api.pugetsound.onebusaway.org
  sandbox: https://sandbox.onebusaway.org

query_settings:
  nested_format: brackets
  array_format: comma

pagination:
  - name: page
    type: page_number
    request:
      page:
        type: integer
        x-stainless-pagination-property:
          purpose: page_number_param
    response:
      list:
        type: array
        items:
          type: object
      total_pages:
        type: integer
        x-stainless-pagination-property:
          purpose: total_page_count_field
  - name: next_url
    type: cursor_url
    request: {}
    response:
      next:
        type: string
        x-stainless-pagination-property:
          purpose: cursor_url_field

resources:
  agency:
    methods:
      retrieve: get /api/where/agency/{agencyID}.json
  stops_for_route:
    methods:
      list:
        endpoint: get /api/where/stops-for-route/{routeID}.json
        paginated: false
  $shared:
    models:
      references: Reference

readme:
  example_requests:
    default:
      type: request
      endpoint: get /api/where/current-time.json
      params: &ref_0 {}
    headline:
      type: request
      endpoint: get /api/where/current-time.json
      params: *ref_0
