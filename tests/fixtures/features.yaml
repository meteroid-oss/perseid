openapi: 3.1.0
info:
  title: Features API
  version: 1.0.0
servers:
  - url: https://{region}.example.com/{version}
    variables:
      region:
        default: eu
        enum: [eu, us]
      version:
        default: v1
security:
  - bearer: []
  - api_key: []
paths:
  /widgets:
    get:
      operationId: list_widgets
      tags: [widgets]
      x-pagination:
        cursor: cursor
        next_cursor: next_cursor
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, format: int32 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WidgetList' }
  /widgets/{widget_id}/events:
    get:
      operationId: list_widget_events
      tags: [widgets]
      x-pagination:
        cursor: starting_after
        item_cursor: id
        has_more: has_more
      parameters:
        - { name: widget_id, in: path, required: true, schema: { type: string } }
        - { name: starting_after, in: query, schema: { type: string } }
        - { name: ending_before, in: query, schema: { type: string } }
        - { name: kind, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventList' }
  /gadgets:
    get:
      operationId: list_gadgets
      tags: [gadgets]
      x-pagination:
        page: page
        items: items
        total_pages: meta.total_pages
        first_page: 0
      parameters:
        - { name: page, in: query, schema: { type: integer, format: int32 } }
        - { name: per_page, in: query, schema: { type: integer, format: int32 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GadgetPage' }
  /records:
    get:
      operationId: list_records
      tags: [records]
      security:
        - api_key_query: []
      x-pagination:
        offset: offset
        total: total
      parameters:
        - { name: offset, in: query, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, format: int32 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryPage' }
  /health:
    get:
      operationId: health
      tags: [account]
      security: []
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /session:
    post:
      operationId: create_session
      tags: [account]
      security:
        - basic: []
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /machine:
    get:
      operationId: machine_status
      tags: [account]
      security:
        - oauth: [machines.read]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /events/stream:
    get:
      operationId: stream_events
      tags: [streaming]
      parameters:
        - { name: topic, in: query, schema: { type: string } }
      responses:
        '200':
          description: server-sent events
          content:
            text/event-stream:
              schema: { type: string }
  /completions:
    post:
      operationId: create_completion
      tags: [streaming]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompletionRequest' }
      responses:
        '200':
          description: the completion, or its chunks as server-sent events with `stream`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Completion' }
            text/event-stream:
              schema: { $ref: '#/components/schemas/CompletionChunk' }
  /files:
    post:
      operationId: upload_file
      tags: [streaming]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, name]
              properties:
                file: { type: string, format: binary }
                name: { type: string }
                count: { type: integer, format: int32 }
                meta: { $ref: '#/components/schemas/Health' }
                tags: { type: array, items: { type: string } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /files/{file_id}/content:
    put:
      operationId: upload_content
      tags: [streaming]
      parameters:
        - { name: file_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /wire/search:
    get:
      operationId: search
      tags: [wire]
      parameters:
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema: { $ref: '#/components/schemas/Filter' }
        - name: expand
          in: query
          style: deepObject
          schema: { type: array, items: { type: string } }
        - name: metadata
          in: query
          schema: { type: object, additionalProperties: { type: string } }
        - name: ids
          in: query
          schema:
            oneOf:
              - { type: string }
              - { type: array, items: { type: string } }
        - name: tags
          in: query
          explode: false
          schema: { type: array, items: { type: string } }
        - name: range
          in: query
          style: deepObject
          schema:
            type: object
            properties:
              gte: { type: integer }
              lt: { type: integer }
        - name: created
          in: query
          style: deepObject
          explode: true
          schema:
            anyOf:
              - title: range_query_specs
                type: object
                properties:
                  gt: { type: integer }
                  gte: { type: integer }
                  lt: { type: integer }
                  lte: { type: integer }
              - type: integer
      responses:
        '200':
          description: the query as the server read it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /wire/charges:
    post:
      operationId: create_charge
      tags: [wire]
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/Charge' }
            encoding:
              expand: { style: deepObject, explode: true }
              shipping: { style: deepObject, explode: true }
              codes: { style: form, explode: false }
      responses:
        '200':
          description: the body as the server read it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /wire/beta?beta=true:
    get:
      operationId: beta_search
      x-perseid-name: beta_search
      tags: [wire]
      parameters:
        - { name: limit, in: query, schema: { type: integer, format: int32 } }
        - name: features
          in: header
          schema: { type: array, items: { type: string } }
      responses:
        '200':
          description: the query as the server read it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /wire/images/{image_id}:
    put:
      operationId: put_image
      tags: [wire]
      parameters:
        - name: image_id
          in: path
          required: true
          schema:
            anyOf:
              - { type: integer }
              - { type: string }
      requestBody:
        required: true
        content:
          image/png:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: the body as the server read it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /items/{item_id}:
    parameters:
      - { name: item_id, in: path, required: true, schema: { type: string } }
    get:
      operationId: get_item
      tags: [items]
      security: []
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
    patch:
      operationId: patch_item
      tags: [items]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemPatch' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
    delete:
      operationId: delete_item
      tags: [items]
      security: []
      responses:
        '204':
          description: deleted, no content
  /scenarios/nullable-body:
    get:
      operationId: nullable_body
      tags: [content]
      security: []
      responses:
        '200':
          description: a JSON null body
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/Item' }
                  - { type: 'null' }
  /scenarios/text:
    get:
      operationId: text_plain
      tags: [content]
      security: []
      responses:
        '200':
          description: plain text
          content:
            text/plain:
              schema: { type: string }
  /scenarios/csv:
    get:
      operationId: text_csv
      tags: [content]
      security: []
      responses:
        '200':
          description: csv text
          content:
            text/csv:
              schema: { type: string }
  /scenarios/blob:
    get:
      operationId: download_blob
      tags: [content]
      security: []
      responses:
        '200':
          description: raw bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /scenarios/image:
    get:
      operationId: download_image
      tags: [content]
      security: []
      responses:
        '200':
          description: png bytes
          content:
            image/png:
              schema: { type: string, format: binary }
  /scenarios/malformed:
    get:
      operationId: malformed_json
      tags: [content]
      security: []
      responses:
        '200':
          description: declared JSON, actually truncated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /scenarios/empty-body:
    get:
      operationId: empty_body
      tags: [content]
      security: []
      responses:
        '200':
          description: declared JSON, actually empty
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /scenarios/extra-fields:
    get:
      operationId: extra_fields
      tags: [content]
      security: []
      responses:
        '200':
          description: carries fields the schema does not declare
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /scenarios/nulls:
    get:
      operationId: get_nulls
      tags: [content]
      security: []
      responses:
        '200':
          description: nulls in nullable fields, array items and map values
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NullBag' }
    post:
      operationId: echo_nulls
      tags: [content]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NullBag' }
      responses:
        '200':
          description: the same bag
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NullBag' }
  /scenarios/bag:
    get:
      operationId: get_bag
      tags: [content]
      security: []
      responses:
        '200':
          description: declared properties plus additionalProperties extras
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bag' }
  /scenarios/labels:
    get:
      operationId: get_labels
      tags: [content]
      security: []
      responses:
        '200':
          description: a pure string map
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Labels' }
  /scenarios/enum:
    get:
      operationId: enum_value
      tags: [content]
      security: []
      parameters:
        - { name: mode, in: query, required: true, schema: { type: string, enum: [known, unknown] } }
      responses:
        '200':
          description: an enum value the schema does not list when mode is unknown
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Paint' }
  /scenarios/bigint:
    post:
      operationId: big_int
      tags: [encoding]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BigBox' }
      responses:
        '200':
          description: the same integers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BigBox' }
  /scenarios/bytes:
    get:
      operationId: bytes_get
      tags: [encoding]
      security: []
      responses:
        '200':
          description: base64 bytes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Blob' }
    post:
      operationId: bytes_echo
      tags: [encoding]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Blob' }
      responses:
        '200':
          description: the same bytes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Blob' }
  /scenarios/datetime:
    get:
      operationId: datetime_query
      tags: [encoding]
      security: []
      parameters:
        - { name: since, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: day, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: the instant the server read
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DateBox' }
    post:
      operationId: datetime_body
      tags: [encoding]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DateBox' }
      responses:
        '200':
          description: the instant the server read
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DateBox' }
  /scenarios/paths/{segment}:
    get:
      operationId: path_segment
      tags: [encoding]
      security: []
      parameters:
        - { name: segment, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: the decoded segment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /scenarios/query:
    get:
      operationId: query_text
      tags: [encoding]
      security: []
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: the decoded query value
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /scenarios/multi:
    get:
      operationId: query_multi
      tags: [encoding]
      security: []
      parameters:
        - { name: ids, in: query, required: true, explode: true, schema: { type: array, items: { type: string } } }
        - { name: flag, in: query, required: true, schema: { type: boolean } }
      responses:
        '200':
          description: the ids in the order they were sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /scenarios/headers:
    get:
      operationId: tenant_headers
      tags: [encoding]
      security: []
      parameters:
        - { name: X-Tenant, in: header, required: true, schema: { type: string } }
        - { name: X-Trace-Id, in: header, schema: { type: string } }
      responses:
        '200':
          description: the headers as the server read them
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /scenarios/cookie:
    get:
      operationId: cookie_session
      tags: [cookies]
      security: []
      parameters:
        - { name: session_id, in: cookie, required: true, schema: { type: string } }
      responses:
        '200':
          description: the cookie value
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /scenarios/cookie-auth:
    get:
      operationId: cookie_auth
      tags: [cookies]
      security:
        - api_key_cookie: []
      responses:
        '200':
          description: the auth cookie value
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /scenarios/flaky:
    get:
      operationId: flaky_service
      tags: [retries]
      security: []
      parameters:
        - { name: X-Scenario-Id, in: header, required: true, schema: { type: string } }
      responses:
        '200':
          description: succeeds on the second attempt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /scenarios/rate-limited:
    get:
      operationId: rate_limited
      tags: [retries]
      security: []
      parameters:
        - { name: X-Scenario-Id, in: header, required: true, schema: { type: string } }
      responses:
        '200':
          description: succeeds on the second attempt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /scenarios/unavailable:
    get:
      operationId: always_unavailable
      tags: [retries]
      security: []
      parameters:
        - { name: X-Scenario-Id, in: header, required: true, schema: { type: string } }
      responses:
        '200':
          description: never succeeds
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /scenarios/idempotent:
    post:
      operationId: idempotent_create
      tags: [retries]
      security: []
      parameters:
        - { name: X-Scenario-Id, in: header, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Payment' }
      responses:
        '200':
          description: succeeds on the second attempt when the key is unchanged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /scenarios/status/{code}:
    get:
      operationId: status_error
      tags: [errors]
      security: []
      parameters:
        - { name: code, in: path, required: true, schema: { type: integer, format: int32 } }
      responses:
        '200':
          description: never returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        default:
          description: the requested error status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /scenarios/pages:
    get:
      operationId: list_pages
      tags: [errors]
      security: []
      x-pagination:
        cursor: cursor
        next_cursor: next_cursor
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: page one; page two fails with 409
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WidgetList' }
        default:
          description: error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /scenarios/sse:
    get:
      operationId: sse_chunked
      tags: [streaming]
      security: []
      responses:
        '200':
          description: server-sent events split across chunks
          content:
            text/event-stream:
              schema: { type: string }
  /scenarios/sse-error:
    get:
      operationId: sse_denied
      tags: [streaming]
      security: []
      responses:
        '200':
          description: server-sent events
          content:
            text/event-stream:
              schema: { type: string }
        default:
          description: refused before any event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
    basic:
      type: http
      scheme: basic
    api_key:
      type: apiKey
      in: header
      name: X-API-Key
    api_key_query:
      type: apiKey
      in: query
      name: api_key
    api_key_cookie:
      type: apiKey
      in: cookie
      name: auth_token
    oauth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            machines.read: Read the machine status
  schemas:
    Widget:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    WidgetList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Widget' }
        next_cursor: { type: [string, 'null'] }
    Event:
      type: object
      required: [id, kind]
      properties:
        id: { type: string }
        kind: { type: string }
    EventList:
      type: object
      required: [data, has_more]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Event' }
        has_more: { type: boolean }
    Gadget:
      type: object
      required: [id]
      properties:
        id: { type: string }
    PageMeta:
      type: object
      required: [page, total_pages]
      properties:
        page: { type: integer, format: int32 }
        total_pages: { type: integer, format: int32 }
    GadgetPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Gadget' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    Entry:
      type: object
      required: [id]
      properties:
        id: { type: string }
    EntryPage:
      type: object
      required: [data, total]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Entry' }
        total: { type: integer, format: int64 }
    CompletionRequest:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string }
        stream: { type: boolean }
    Completion:
      type: object
      required: [text]
      properties:
        text: { type: string }
    CompletionChunk:
      type: object
      required: [delta]
      properties:
        delta: { type: string }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Filter:
      type: object
      properties:
        status: { type: string }
        amount:
          type: object
          properties:
            gte: { type: integer }
    Charge:
      type: object
      required: [id, amount]
      properties:
        id: { type: string, readOnly: true }
        amount: { type: integer }
        capture: { type: boolean }
        metadata: { type: object, additionalProperties: { type: string } }
        items:
          type: array
          items:
            type: object
            required: [price]
            properties:
              price: { type: string }
              quantity: { type: integer }
        expand: { type: array, items: { type: string } }
        statuses: { type: array, items: { type: string } }
        codes: { type: array, items: { type: string } }
        shipping:
          type: object
          properties:
            address:
              type: object
              properties:
                line1: { type: string }
                city: { type: string }
    Item:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        note: { type: [string, 'null'] }
    ItemPatch:
      type: object
      properties:
        name: { type: string }
        note: { type: [string, 'null'] }
    NullBag:
      type: object
      required: [name, tags, counts]
      properties:
        name: { type: [string, 'null'] }
        tags:
          type: array
          items: { type: [string, 'null'] }
        counts:
          type: object
          additionalProperties: { type: [integer, 'null'] }
