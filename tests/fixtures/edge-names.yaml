openapi: 3.1.0
info:
  title: Client
  version: 1.0.0
  description: Schema and property names that collide with runtime types, builtins and keywords of the generated SDKs.
servers:
  - url: https://api.example.com
paths:
  /echo:
    post:
      operationId: echo
      tags: [echo]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Holder'}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Holder'}
  /props:
    post:
      operationId: echo_props
      tags: [echo]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Props'}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Props'}
  /spelling:
    post:
      operationId: echo_spelling
      tags: [echo]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Spelling'}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Spelling'}
  /inline-collisions:
    post:
      operationId: create_pet
      tags: [pets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                n: {type: integer}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Pet'}
  /bases:
    post:
      operationId: echo_pet_base
      tags: [echo]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PetBase'}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PetBase'}
  /hyphenated-unions:
    post:
      operationId: echo_hyphenated_union
      tags: [echo]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/issue-event-for-issue'}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/timeline-issue-events'}
