openapi: 3.1.0
info:
  title: Forms
  version: 1.0.0
  description: "A form operation that also answers an event stream, as OpenAI's transcriptions."
servers:
  - url: https://api.example.com/v1
paths:
  /transcriptions:
    post:
      operationId: createTranscription
      tags: [transcriptions]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/TranscriptionRequest'}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Transcription'}
            text/event-stream:
              schema: {$ref: '#/components/schemas/TranscriptionDelta'}
  /uploads:
    post:
      operationId: createUpload
      tags: [uploads]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/UploadRequest'}
            encoding:
              image: {contentType: image/png}
              doc: {contentType: application/octet-stream}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Transcription'}
  /deltas:
    get:
      operationId: listDeltas
      tags: [deltas]
      responses:
        '200':
          description: ok
          content:
            text/event-stream:
              schema: {$ref: '#/components/schemas/Delta'}
components:
  schemas:
    TranscriptionRequest:
      type: object
      required: [file, model]
      properties:
        file: {type: string, format: binary}
        model: {type: string}
        stream: {type: boolean}
    Transcription:
      type: object
      required: [text]
      properties:
        text: {type: string}
    TranscriptionDelta:
      type: object
      required: [delta]
      properties:
        delta: {type: string}
    UploadRequest:
      type: object
      required: [image]
      properties:
        image: {type: string, format: binary}
        doc: {type: string, format: binary}
    Delta:
      type: object
      properties:
        text: {type: string}
        error: {type: string}
