name: MCP pack

on:
  push:
    branches: [main]
    paths: ["packs/mcp/**", "packages/perseid-mcp/**", "packages/tsconfig.base.json", "src/**", "templates/typescript/**", "runtime/typescript/**", "packs/cli/tests/acme/openapi.json", "packs/cli/tests/mock.py", ".github/workflows/packs-mcp.yml"]
  pull_request:
    paths: ["packs/mcp/**", "packages/perseid-mcp/**", "packages/tsconfig.base.json", "src/**", "templates/typescript/**", "runtime/typescript/**", "packs/cli/tests/acme/openapi.json", "packs/cli/tests/mock.py", ".github/workflows/packs-mcp.yml"]


jobs:
  # The runtime package: types, and its tests on every sandbox (Deno, QuickJS, the runner), the
  # OAuth broker and the HTTP handler.
  runtime:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/perseid-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm run build && npm test

  # Renders the pack against tests/acme, builds its TypeScript SDK and the server on perseid-mcp
  # as packages/ has it, then runs the server against the CLI pack's mock API: search, execute
  # in each sandbox, read-only, HTTP, OAuth.
  pack:
    strategy:
      fail-fast: false
      matrix:
        sandbox: [deno, quickjs, remote]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
      # perseid and perseid-mcp as this commit has them.
      - run: cargo build --locked && echo "PERSEID=$GITHUB_WORKSPACE/target/debug/perseid" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
        working-directory: packages/perseid-mcp
      - run: packs/mcp/tests/run.sh
        env:
          WORK: ${{ runner.temp }}/acme
          SANDBOX: ${{ matrix.sandbox }}
      # The same server as a Cloudflare Worker: it builds and bundles, QuickJS's WebAssembly with it.
      - if: matrix.sandbox == 'quickjs'
        working-directory: ${{ runner.temp }}/acme/mcp
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"
