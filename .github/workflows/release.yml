name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: macos-15, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: |
          cargo build --release --locked --target ${{ matrix.target }}
          test "$(target/${{ matrix.target }}/release/perseid --version)" = "perseid ${GITHUB_REF_NAME#v}"
          cp target/${{ matrix.target }}/release/perseid .
          tar -czf perseid-${{ matrix.target }}.tar.gz perseid LICENSE LICENSE-Meteroid LICENSE-Svix NOTICE
      - uses: actions/upload-artifact@v4
        with:
          name: perseid-${{ matrix.target }}
          path: perseid-*.tar.gz
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: perseid-*
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum perseid-*.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes perseid-*.tar.gz SHA256SUMS

  image:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux/amd64 }
          - { runner: ubuntu-24.04-arm, platform: linux/arm64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
      - run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.runner }}
          path: digests/*

  manifest:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - working-directory: digests
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          # shellcheck disable=SC2046 # one argument per digest
          docker buildx imagetools create -t "$image:$version" -t "$image:${version%%.*}" -t "$image:latest" \
            $(printf "$image@sha256:%s " *)

  major-tag:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
