name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v0.3.0
        required: true
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
env:
  TAG: ${{ inputs.tag || github.ref_name }}
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: macos-15, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: |
          cargo build --release --locked --target ${{ matrix.target }}
          test "$(target/${{ matrix.target }}/release/perseid --version)" = "perseid ${TAG#v}"
          cp target/${{ matrix.target }}/release/perseid .
          tar -czf perseid-${{ matrix.target }}.tar.gz perseid LICENSE LICENSE-Meteroid LICENSE-Svix NOTICE
      - uses: actions/upload-artifact@v4
        with:
          name: perseid-${{ matrix.target }}
          path: perseid-*.tar.gz
          if-no-files-found: error
      - uses: astral-sh/setup-uv@v6
      - run: |
          compatibility=()
          if [ "$RUNNER_OS" = Linux ]; then compatibility=(--compatibility manylinux2014 musllinux_1_2); fi
          uvx --from 'maturin>=1.9,<2' maturin build --release --locked --target ${{ matrix.target }} "${compatibility[@]}" --out wheels
          ls "wheels/perseid-${TAG#v}-"*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: wheels/*.whl
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: perseid-*
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum perseid-*.tar.gz > SHA256SUMS
          # The release may already exist when it was drafted in the UI (Marketplace publishing).
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber perseid-*.tar.gz SHA256SUMS
          else
            gh release create "$TAG" --verify-tag --generate-notes perseid-*.tar.gz SHA256SUMS
          fi

  npm:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: perseid-*
          merge-multiple: true
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@latest
      - run: |
          version="${TAG#v}"
          npm/stage.sh "$version" dist staged
          for package in perseid-linux-x64 perseid-linux-arm64 perseid-darwin-x64 perseid-darwin-arm64 perseid; do
            if [ -n "$(npm view "$package@$version" version 2>/dev/null)" ]; then
              echo "$package@$version is already published"
            else
              npm publish "./staged/$package" --provenance --access public
            fi
          done

  pypi:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  # After the GitHub release, whose archives cargo binstall downloads.
  crates:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - id: registry
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' -A "release (github.com/$GITHUB_REPOSITORY)" \
            "https://crates.io/api/v1/crates/perseid/${TAG#v}")"
          case "$status" in
            200) echo "published=true" >> "$GITHUB_OUTPUT"; echo "perseid ${TAG#v} is already published" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "crates.io answered $status"; exit 1 ;;
          esac
      - if: steps.registry.outputs.published == 'false'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - if: steps.registry.outputs.published == 'false'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.registry.outputs.published == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - if: steps.registry.outputs.published == 'false'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  image:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux/amd64 }
          - { runner: ubuntu-24.04-arm, platform: linux/arm64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
      - run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.runner }}
          path: digests/*

  manifest:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - working-directory: digests
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${TAG#v}"
          # shellcheck disable=SC2046 # one argument per digest
          docker buildx imagetools create -t "$image:$version" -t "$image:${version%%.*}" -t "$image:latest" \
            $(printf "$image@sha256:%s " *)

  major-tag:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - run: |
          major="${TAG%%.*}"
          git tag -f "$major" "$(git rev-parse HEAD)"
          git push -f origin "refs/tags/$major"
