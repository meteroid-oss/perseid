name: CLI pack

on:
  push:
    branches: [main]
    paths: ["packs/cli/**", "src/**", "templates/rust/**", "runtime/rust/**", ".github/workflows/packs-cli.yml"]
  pull_request:
    paths: ["packs/cli/**", "src/**", "templates/rust/**", "runtime/rust/**", ".github/workflows/packs-cli.yml"]


jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packs/cli/runtime-crate
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packs/cli/runtime-crate
      - if: runner.os == 'Linux'
        run: cargo fmt --check
      - if: runner.os == 'Linux'
        run: cargo clippy --all-targets --locked -- -D warnings
      - if: runner.os == 'Linux'
        run: cargo clippy --no-default-features --all-targets --locked -- -D warnings
      - if: runner.os == 'Linux'
        run: cargo clippy --all-features --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # The keyring's tests use keyring-core's mock store; this builds each platform's store.
      - run: cargo test --locked --features keyring

  # The rust-version of runtime-crate/Cargo.toml and of the generated crates.
  msrv:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packs/cli/runtime-crate
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packs/cli/runtime-crate
      - run: cargo check --all-targets --locked
      - run: cargo check --no-default-features --locked
      - run: cargo check --all-features --locked

  # Renders the pack against tests/acme, then builds, lints and runs the CLI against a mock API.
  pack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            packs/cli/runtime-crate -> ../target
          cache-bin: false
      # perseid as this commit has it.
      - run: cargo build --locked && echo "PERSEID=$GITHUB_WORKSPACE/target/debug/perseid" >> "$GITHUB_ENV"
      # The version of dist the scaffold's dist-workspace.toml pins.
      - run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
      - run: packs/cli/tests/run.sh
        env:
          WORK: ${{ runner.temp }}/acme
      - uses: actions/upload-artifact@v4
        with:
          name: acme-cli
          path: ${{ runner.temp }}/acme
          retention-days: 3

  # The CLI rendered by `pack`, built and tested on the other platforms of its releases.
  pack-platforms:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: acme-cli
          path: acme
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: acme/cli -> ../../target
      - run: cargo test --locked --manifest-path acme/cli/Cargo.toml
      - run: |
          rust=$(cd acme/rust && { pwd -W 2>/dev/null || pwd; })
          cargo test --locked --manifest-path acme/cli/generated/Cargo.toml \
            --config "patch.crates-io.acme-rs.path=\"$rust\""
