name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Install oasdiff, for the release sizing tests
        run: |
          cargo run --locked --quiet -- tools install rust --dir "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - run: cargo test --locked
      - name: Lint the scaffolded release workflow
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint scaffold/release/.github/workflows/*.yml target/tmp/*.yml

  # A fresh `init` + `generate` must give SDKs that build, type-check and pass their generated
  # tests and round trips, for a toy spec, the torture fixture (unions, recursion, reserved
  # words...) and a real API.
  sdks:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        spec:
          - tests/fixtures/petstore.yaml
          - tests/fixtures/features.yaml
          - tests/fixtures/torture.yaml
          - tests/fixtures/realworld.yaml
          - tests/fixtures/edge-names.yaml
          - tests/fixtures/edge-types.yaml
          - tests/fixtures/edge-unions.yaml
          - tests/fixtures/edge-operations.yaml
          - tests/fixtures/edge-security.yaml
          - tests/fixtures/edge-legacy.yaml
          - tests/fixtures/edge-oas32.yaml
          - tests/fixtures/edge-swagger2.yaml
          - tests/fixtures/petstore-swagger2.json
          - https://raw.githubusercontent.com/meteroid-oss/meteroid-clients/main/spec/openapi.json
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-dotnet@v4
        with:
          # SDKs target .NET 8; the newest SDK builds them, with its stricter analyzers.
          dotnet-version: |
            8.0.x
            10.0.x
      - run: cargo install --locked --path . --root "$RUNNER_TEMP/perseid"
      - run: |
          echo "$RUNNER_TEMP/perseid/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/perseid/bin/perseid" tools install typescript python java csharp
      - name: Generate
        working-directory: ${{ runner.temp }}
        run: |
          mkdir sdk && cd sdk
          perseid init --sdks rust,typescript,python,go,java,csharp --spec "${{ startsWith(matrix.spec, 'https') && matrix.spec || format('{0}/{1}', github.workspace, matrix.spec) }}"
          sed -i '/^name = /a round_trips = true' perseid.toml
          perseid generate
          perseid generate --check
      - working-directory: ${{ runner.temp }}/sdk/rust
        run: |
          cargo check
          if [ -d tests/api ]; then cargo test --test api; fi
          if [ -f tests/round_trips.rs ]; then cargo test --test round_trips; fi
      - working-directory: ${{ runner.temp }}/sdk/typescript
        run: npm install --no-audit --no-fund && npx tsc --noEmit && npm test
      - working-directory: ${{ runner.temp }}/sdk/python
        run: |
          package=$(sed -n 's/^name = "\(.*\)"/\1/p' pyproject.toml | tr - _)
          uv venv && uv pip install -e . mypy
          uv run python -c "import $package"
          uv run mypy --strict "$package"
          if [ -d tests ]; then uv run python -m unittest discover -s tests; fi
      - working-directory: ${{ runner.temp }}/sdk/go
        run: go vet ./... && go test ./...
      - working-directory: ${{ runner.temp }}/sdk/java
        run: gradle build --no-daemon
      - working-directory: ${{ runner.temp }}/sdk/csharp
        run: dotnet build -warnaserror && dotnet test --no-build
      - if: endsWith(matrix.spec, 'petstore.yaml')
        run: dotnet run --project tests/csharp -p:SdkProject="$RUNNER_TEMP/sdk/csharp/Petstore/Petstore.csproj"
      - name: Smoke tests against a mock server
        if: endsWith(matrix.spec, 'features.yaml')
        run: |
          for language in typescript python go java rust csharp; do
            tests/features/run.sh "$language" "$RUNNER_TEMP/sdk/$language"
          done

  # Runtime behaviour (retries, idempotency, middleware, webhooks) and torture round trips,
  # exercised by tests inside each generated SDK.
  extensions:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language: [rust, typescript, python, go, java, csharp]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: astral-sh/setup-uv@v6
      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          # SDKs target .NET 8; the newest SDK builds them, with its stricter analyzers.
          dotnet-version: |
            8.0.x
            10.0.x
      - run: cargo install --locked --path . --root "$RUNNER_TEMP/perseid"
      - run: |
          echo "$RUNNER_TEMP/perseid/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/perseid/bin/perseid" tools install ${{ matrix.language }}
      - run: tests/sdk/run.sh ${{ matrix.language }}

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker build -t perseid .
          docker run --rm -v "$PWD/tests/fixtures:/work" perseid init --spec petstore.yaml --sdks rust,typescript,python,go,java,csharp
          docker run --rm -v "$PWD/tests/fixtures:/work" perseid generate
          docker run --rm -v "$PWD/tests/fixtures:/work" perseid generate --check
