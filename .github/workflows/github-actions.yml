name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Lint the scaffolded release workflow
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint scaffold/release/.github/workflows/*.yml

  # A fresh `init` + `generate` must give SDKs that build and type-check, for a toy spec, the
  # torture fixture (unions, recursion, reserved words...) and a real API.
  sdks:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        spec:
          - tests/fixtures/petstore.yaml
          - tests/fixtures/features.yaml
          - tests/fixtures/torture.yaml
          - https://raw.githubusercontent.com/meteroid-oss/meteroid-clients/main/spec/openapi.json
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: cargo install --locked --path . --root "$RUNNER_TEMP/perseid"
      - run: |
          echo "$RUNNER_TEMP/perseid/bin" >> "$GITHUB_PATH"
          curl -fsSL -o "$RUNNER_TEMP/gjf.jar" https://github.com/google/google-java-format/releases/download/v1.25.2/google-java-format-1.25.2-all-deps.jar
          printf '#!/bin/sh\nexec java -jar %s "$@"\n' "$RUNNER_TEMP/gjf.jar" > "$RUNNER_TEMP/perseid/bin/google-java-format"
          chmod +x "$RUNNER_TEMP/perseid/bin/google-java-format"
          dotnet tool install csharpier --version 1.3.0 --tool-path "$RUNNER_TEMP/perseid/bin"
      - name: Generate
        working-directory: ${{ runner.temp }}
        run: |
          mkdir sdk && cd sdk
          perseid init --spec "${{ startsWith(matrix.spec, 'https') && matrix.spec || format('{0}/{1}', github.workspace, matrix.spec) }}"
          perseid generate
          perseid generate --check
      - working-directory: ${{ runner.temp }}/sdk/rust
        run: cargo check
      - working-directory: ${{ runner.temp }}/sdk/typescript
        run: npm install --no-audit --no-fund && npx tsc --noEmit
      - working-directory: ${{ runner.temp }}/sdk/python
        run: |
          package=$(sed -n 's/^name = "\(.*\)"/\1/p' pyproject.toml | tr - _)
          uv venv && uv pip install -e . mypy
          uv run python -c "import $package"
          uv run mypy --strict "$package"
      - working-directory: ${{ runner.temp }}/sdk/go
        run: go vet ./...
      - working-directory: ${{ runner.temp }}/sdk/java
        run: gradle build --no-daemon
      - working-directory: ${{ runner.temp }}/sdk/csharp
        run: dotnet build -warnaserror
      - if: endsWith(matrix.spec, 'petstore.yaml')
        run: dotnet run --project tests/csharp -p:SdkProject="$RUNNER_TEMP/sdk/csharp/Petstore/Petstore.csproj"
      - name: Smoke tests against a mock server
        if: endsWith(matrix.spec, 'features.yaml')
        run: |
          for language in typescript python go java rust csharp; do
            tests/features/run.sh "$language" "$RUNNER_TEMP/sdk/$language"
          done

  # Runtime behaviour (retries, idempotency, middleware, webhooks) and torture round trips,
  # exercised by tests inside each generated SDK.
  extensions:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language: [rust, typescript, python, go, java, csharp]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: astral-sh/setup-uv@v6
      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: cargo install --locked --path . --root "$RUNNER_TEMP/perseid"
      - run: |
          echo "$RUNNER_TEMP/perseid/bin" >> "$GITHUB_PATH"
          curl -fsSL -o "$RUNNER_TEMP/gjf.jar" https://github.com/google/google-java-format/releases/download/v1.25.2/google-java-format-1.25.2-all-deps.jar
          printf '#!/bin/sh\nexec java -jar %s "$@"\n' "$RUNNER_TEMP/gjf.jar" > "$RUNNER_TEMP/perseid/bin/google-java-format"
          chmod +x "$RUNNER_TEMP/perseid/bin/google-java-format"
      - if: matrix.language == 'csharp'
        run: dotnet tool install csharpier --version 1.3.0 --tool-path "$RUNNER_TEMP/perseid/bin"
      - run: tests/sdk/run.sh ${{ matrix.language }}

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker build -t perseid .
          docker run --rm -v "$PWD/tests/fixtures:/work" perseid init --spec petstore.yaml
          docker run --rm -v "$PWD/tests/fixtures:/work" perseid generate
          docker run --rm -v "$PWD/tests/fixtures:/work" perseid generate --check
