name: Release PR
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-please
jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
  # Tags made with GITHUB_TOKEN trigger no workflow, but dispatches do. Dispatching, rather than
  # calling, release.yml keeps it the top-level workflow npm trusts.
  release:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh workflow run release.yml --ref "$TAG" -f tag="$TAG"
