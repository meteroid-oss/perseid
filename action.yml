name: Perseid OpenAPI SDK Generator
description: Generate idiomatic Rust, TypeScript, Python, Go and Java SDKs from OpenAPI and open pull requests. No cloud, no subscription.
branding:
  icon: package
  color: purple

inputs:
  command:
    description: Arguments passed to perseid
    default: generate --pr
  version:
    description: Perseid version (default, the one matching this action's ref)
    default: ''
  token:
    description: GitHub token, needs contents and pull-requests write on every target repository
    default: ${{ github.token }}
  working-directory:
    description: Directory containing perseid.toml
    default: .

runs:
  using: composite
  steps:
    - name: Install perseid
      id: setup
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PERSEID_VERSION: ${{ inputs.version }}
        PERSEID_INSTALL: ${{ runner.temp }}/perseid
      run: |
        # The binary matching this action's own code, whether it's used @v0, @v0.2.1 or @<sha>.
        export PERSEID_VERSION="${PERSEID_VERSION:-$(sed -n 's/^version = "\(.*\)"/\1/p' "$GITHUB_ACTION_PATH/Cargo.toml" | head -1)}"
        sh "$GITHUB_ACTION_PATH/install.sh"
        echo "$PERSEID_INSTALL" >> "$GITHUB_PATH"
        languages=$(grep -oE '^\[(rust|typescript|python|go|java|csharp)[].]' perseid.toml | tr -d '[].' | sort -u | tr '\n' ' ')
        echo "languages=$languages" >> "$GITHUB_OUTPUT"

    - if: contains(steps.setup.outputs.languages, 'rust')
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt

    - if: contains(steps.setup.outputs.languages, 'go')
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache: false

    - if: contains(steps.setup.outputs.languages, 'csharp')
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install formatters
      shell: bash
      env:
        LANGUAGES: ${{ steps.setup.outputs.languages }}
        BIN: ${{ runner.temp }}/perseid
      run: |
        arch=$([ "$(uname -m)" = x86_64 ] && echo x64 || echo arm64)
        fetch() { curl -fsSL --retry 3 -o "$1" "$2"; }
        case " $LANGUAGES " in *" typescript "*)
          fetch "$BIN/biome" "https://github.com/biomejs/biome/releases/download/%40biomejs%2Fbiome%402.1.4/biome-linux-$arch"
          chmod +x "$BIN/biome" ;;
        esac
        case " $LANGUAGES " in *" python "*)
          triple=$([ "$arch" = x64 ] && echo x86_64 || echo aarch64)-unknown-linux-gnu
          fetch ruff.tar.gz "https://github.com/astral-sh/ruff/releases/download/0.14.10/ruff-$triple.tar.gz"
          tar -xzf ruff.tar.gz --strip-components 1 -C "$BIN" "ruff-$triple/ruff" && rm ruff.tar.gz ;;
        esac
        case " $LANGUAGES " in *" java "*)
          gjf=https://github.com/google/google-java-format/releases/download/v1.25.2
          if [ "$arch" = x64 ]; then
            fetch "$BIN/google-java-format" "$gjf/google-java-format_linux-x86-64"
          else
            fetch "$BIN/google-java-format.jar" "$gjf/google-java-format-1.25.2-all-deps.jar"
            printf '#!/bin/sh\nexec java -jar %s "$@"\n' "$BIN/google-java-format.jar" > "$BIN/google-java-format"
          fi
          chmod +x "$BIN/google-java-format" ;;
        esac
        case " $LANGUAGES " in *" csharp "*)
          dotnet tool install csharpier --version 1.3.0 --tool-path "$BIN" ;;
        esac

    - name: Run perseid
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.token }}
        COMMAND: ${{ inputs.command }}
      run: |
        gh auth setup-git
        git config user.name >/dev/null || git config --global user.name 'github-actions[bot]'
        git config user.email >/dev/null || git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
        perseid $COMMAND
