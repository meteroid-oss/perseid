name: Perseid OpenAPI SDK Generator
description: Generate idiomatic Rust, TypeScript, Python, Go, Java and C# SDKs from OpenAPI and open pull requests. No cloud, no subscription.
branding:
  icon: package
  color: purple

inputs:
  command:
    description: Arguments passed to perseid
    default: generate --pr
  version:
    description: Perseid version (default, the one matching this action's ref)
    default: ''
  token:
    description: GitHub token, needs contents and pull-requests write on every target repository. Unused with `app-id`
    default: ${{ github.token }}
  app-id:
    description: >-
      ID of a GitHub App installed on the repository holding perseid.toml and the SDK repositories:
      the Action mints a token of it for them, with contents and pull-requests write
    default: ''
  app-private-key:
    description: Private key of the `app-id` App
    default: ''
  working-directory:
    description: Directory containing perseid.toml
    default: .
  bump:
    description: >-
      Release size pull requests ask for: major, minor or patch. `auto` compares the spec with
      `base-spec` using oasdiff: breaking changes are major, other API changes minor, the rest patch
    default: auto
  base-spec:
    description: Previous OpenAPI document compared by the `auto` bump (default, the spec file before the pushed commits)
    default: ''
  relax-enum-additions:
    description: >-
      Count enum values added to responses as minor changes instead of breaking ones. Only right
      for SDKs whose enums accept unknown values
    default: 'true'
  auto-merge:
    description: >-
      Enable GitHub auto-merge (squash) on the SDK pull requests, and on the release PRs they lead to
      (label `perseid:auto-release`, read by the scaffolded sdk-release.yml)
    default: 'false'
  ci-workflows:
    description: >-
      Workflow files (space or newline separated) to dispatch on `perseid/update` once its pull
      request is opened or updated in this repository, when `token` is the default GITHUB_TOKEN,
      whose pushes start no workflow. The job needs `actions: write`
    default: ''

runs:
  using: composite
  steps:
    - name: Install perseid
      id: setup
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PERSEID_VERSION: ${{ inputs.version }}
        PERSEID_INSTALL: ${{ runner.temp }}/perseid
      run: |
        # The binary matching this action's own code, whether it's used @v0, @v0.2.1 or @<sha>.
        export PERSEID_VERSION="${PERSEID_VERSION:-$(jq -r '."."' "$GITHUB_ACTION_PATH/.release-please-manifest.json")}"
        sh "$GITHUB_ACTION_PATH/install.sh"
        echo "$PERSEID_INSTALL" >> "$GITHUB_PATH"
        "$PERSEID_INSTALL/perseid" tools list --github-output

    - if: contains(steps.setup.outputs.languages, 'rust')
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt

    - if: contains(steps.setup.outputs.languages, 'go')
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache: false

    - if: contains(steps.setup.outputs.languages, 'csharp')
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install formatters and oasdiff
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: perseid tools install

    # App installation tokens expire after an hour, so they are minted on each run.
    - id: app
      if: inputs.app-id != ''
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ steps.setup.outputs.owner }}
        repositories: ${{ steps.setup.outputs.repositories }}
        permission-contents: write
        permission-pull-requests: write
        permission-workflows: write

    - name: Run perseid
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ steps.app.outputs.token || inputs.token }}
        COMMAND: ${{ inputs.command }}
        GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        PERSEID_BUMP: ${{ inputs.bump }}
        PERSEID_BASE_SPEC: ${{ inputs.base-spec }}
        PERSEID_RELAX_ENUM_ADDITIONS: ${{ inputs.relax-enum-additions }}
        PERSEID_AUTO_MERGE: ${{ inputs.auto-merge }}
        PERSEID_DISPATCH: ${{ steps.app.outputs.token == '' && inputs.token == github.token && inputs.ci-workflows || '' }}
      run: |
        # perseid reads these as flags, which can't be empty.
        for name in "${!PERSEID_@}"; do [ -n "${!name}" ] || unset "$name"; done
        gh auth setup-git
        perseid $COMMAND
