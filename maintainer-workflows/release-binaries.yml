# Activate as .github/workflows/release-binaries.yml in the Perseid repository.
name: Release native binaries
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (must match Cargo.toml)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install static Linux linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build and test
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cargo test --locked --target "$TARGET"
          cargo build --release --locked --target "$TARGET"
          test "$(target/"$TARGET"/release/perseid --version)" = "perseid ${RELEASE_TAG#v}"
          target/"$TARGET"/release/perseid init --name smoke --language rust --output "$RUNNER_TEMP/smoke"
          mkdir release-package
          cp "target/$TARGET/release/perseid" LICENSE LICENSE-Meteroid LICENSE-Svix NOTICE release-package/
          tar -czf "perseid-$TARGET.tar.gz" -C release-package perseid LICENSE LICENSE-Meteroid LICENSE-Svix NOTICE
      - uses: actions/setup-python@v5
        if: matrix.runner == 'ubuntu-24.04'
        with:
          python-version: '3.12'
      - name: Test complete lifecycle using release binary
        if: matrix.runner == 'ubuntu-24.04'
        env:
          PERSEID_BIN: ${{ github.workspace }}/target/${{ matrix.target }}/release/perseid
        run: python3 -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: perseid-${{ matrix.target }}
          path: perseid-*.tar.gz
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: perseid-*
          merge-multiple: true
          path: dist
      - name: Publish complete release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          sha256sum perseid-*.tar.gz > SHA256SUMS
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes
          fi
          gh release upload "$RELEASE_TAG" perseid-*.tar.gz SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false
