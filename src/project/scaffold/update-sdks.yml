# Generated by Perseid; committed workflows are yours to customize.
name: Update SDKs
on:
  repository_dispatch:
    types: [openapi-updated]
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: perseid-sdk-updates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
@@SETUP@@
      - name: Sync OpenAPI and open SDK update PRs
        env:
          GH_TOKEN: ${{ secrets.PERSEID_TOKEN || github.token }}
        run: |
          gh auth setup-git
          perseid sync
          perseid generate --pr
