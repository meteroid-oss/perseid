# Uses the committed snapshot; no backend credential is exposed to pull requests.
name: Check SDKs
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
@@SETUP@@
      - name: Check generated SDKs
        if: ${{ hashFiles('perseid.lock.json') != '' }}
        run: perseid check
      - name: Await first generation
        if: ${{ hashFiles('perseid.lock.json') == '' }}
        run: |
          if git cat-file -e origin/main:perseid.lock.json 2>/dev/null; then
            echo 'The committed generation lock is missing.' >&2
            exit 1
          fi
          echo 'Merge the initial SDK update PR to enable generation checks.'
