# The backend only notifies; the orchestration repository owns SDK generation.
name: Notify SDK orchestrator
on:
  push:
    branches: [@@BRANCH@@]
    paths: [@@SPEC@@]
  workflow_dispatch:
permissions: {}
jobs:
  notify:
    runs-on: ubuntu-24.04
    steps:
      - name: Notify the orchestration repository
        env:
          GH_TOKEN: ${{ secrets.PERSEID_TOKEN }}
          ORCHESTRATOR: @@REPOSITORY@@
        run: gh api --method POST "repos/$ORCHESTRATOR/dispatches" -f event_type=openapi-updated
