name: Perseid push spec
description: Push an OpenAPI spec to the repository holding the perseid.toml of its SDKs, unless it holds a newer one
branding:
  icon: send
  color: purple

inputs:
  spec:
    description: OpenAPI document, relative to the repository root
    required: true
  to:
    description: SDKs repository, owner/name
    required: true
  token:
    description: >-
      Token that can write to `to`. Without it, the hosted perseid App's, when the job has
      `id-token: write` and the perseid.toml of `to` names this repository as its `source`
    default: ''
  private:
    description: Leave this repository's name out of what the SDKs repository records
    default: 'false'
  version:
    description: Perseid version (default, the one matching this action's ref)
    default: ''

runs:
  using: composite
  steps:
    - name: Install perseid
      shell: bash
      env:
        PERSEID_VERSION: ${{ inputs.version }}
        PERSEID_INSTALL: ${{ runner.temp }}/perseid
      run: |
        export PERSEID_VERSION="${PERSEID_VERSION:-$(jq -r '."."' "$GITHUB_ACTION_PATH/../.release-please-manifest.json")}"
        sh "$GITHUB_ACTION_PATH/../install.sh"

    # Without a token, the hosted perseid App's: `to` names this repository as its source.
    - id: hosted
      if: inputs.token == ''
      shell: bash
      env:
        REPOSITORIES: ${{ inputs.to }}
        PERMISSIONS: '{"contents":"write"}'
      run: '"$GITHUB_ACTION_PATH/../hosted-token.sh"'

    - name: Push the spec
      shell: bash
      env:
        SPEC: ${{ inputs.spec }}
        TO: ${{ inputs.to }}
        PRIVATE: ${{ inputs.private }}
        PERSEID_SDKS_TOKEN: ${{ inputs.token || steps.hosted.outputs.token }}
      run: |
        "$RUNNER_TEMP/perseid/perseid" push-spec "$SPEC" --to "$TO" $([ "$PRIVATE" = true ] && echo --private)
